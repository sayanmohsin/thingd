apiVersion: v1
kind: Secret
metadata:
  name: thingd-auth
type: Opaque
stringData:
  THINGD_AUTH_TOKEN: change-me
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: thingd-sidecar-example
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thingd-sidecar-example
  template:
    metadata:
      labels:
        app: thingd-sidecar-example
    spec:
      containers:
        - name: app
          image: your-node-app:latest
          env:
            - name: THINGD_URL
              value: http://127.0.0.1:8757
            - name: THINGD_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: thingd-auth
                  key: THINGD_AUTH_TOKEN

        - name: thingd
          image: ghcr.io/sayanmohsin/thingd:latest
          env:
            - name: THINGD_PATH
              value: /data/thingd.db
            - name: THINGD_DRIVER
              value: native
            - name: THINGD_HOST
              value: 0.0.0.0
            - name: THINGD_PORT
              value: "8757"
            - name: THINGD_CLUSTER_MODE
              value: single
            - name: THINGD_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: thingd-auth
                  key: THINGD_AUTH_TOKEN
          ports:
            - name: thingd
              containerPort: 8757
          readinessProbe:
            httpGet:
              path: /healthz
              port: thingd
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: thingd
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: thingd-data
              mountPath: /data
      volumes:
        - name: thingd-data
          emptyDir: {}
