name: Release

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  build-native:
    name: Build native (${{ matrix.platform }}-${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: macos-14
            platform: darwin
            arch: arm64
          - os: macos-13
            platform: darwin
            arch: x64
          - os: windows-latest
            platform: win32
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build native binary
        run: cargo build -p thingd-native --release

      - name: Copy prebuild
        run: node packages/thingd-native/scripts/copy-prebuild.mjs

      - name: Upload prebuild artifact
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-${{ matrix.platform }}-${{ matrix.arch }}
          path: packages/thingd-native/prebuilds/

  release:
    name: Publish to npm
    needs: [build-native]
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Download all prebuild artifacts
        uses: actions/download-artifact@v4
        with:
          path: prebuild-artifacts

      - name: Merge prebuilds into thingd-native package
        run: |
          mkdir -p packages/thingd-native/prebuilds
          for dir in prebuild-artifacts/*/; do
            if [ -d "$dir" ]; then
              cp -r "$dir". packages/thingd-native/prebuilds/
            fi
          done
          echo "Prebuilds after merge:"
          ls -la packages/thingd-native/prebuilds/*/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages (skip examples)
        run: pnpm --filter !examples* -r --if-present build

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm release
