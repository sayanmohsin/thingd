[package]
name = "thingd-native"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Native Node.js binding for thingd."
keywords = ["ai", "memory", "napi", "nodejs", "persistent-storage"]
categories = ["api-bindings", "database-implementations"]

[lib]
crate-type = ["cdylib"]
path = "native/src/lib.rs"

[dependencies]
thingd = { path = "../../crates/thingd", version = "0.81", features = ["persistent", "search", "vectors"] } # x-release-please-version
thingd-schema = { path = "../../crates/thingd-schema", version = "0.81" }
uuid = { version = "1", features = ["v4"] }
napi = { version = "3.12.1", default-features = false, features = ["napi4"] }
napi-derive = "3.6.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[build-dependencies]
napi-build = "2.4.1"
