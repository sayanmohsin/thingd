apiVersion: v1
kind: Secret
metadata:
  name: thingd-cluster-auth
type: Opaque
stringData:
  THINGD_AUTH_TOKEN: change-me
---
apiVersion: v1
kind: Service
metadata:
  name: thingd-leader
spec:
  selector:
    app: thingd-leader
  ports:
    - name: thingd
      port: 8757
      targetPort: thingd
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: thingd-leader
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thingd-leader
  template:
    metadata:
      labels:
        app: thingd-leader
    spec:
      containers:
        - name: thingd
          image: ghcr.io/sayanmohsin/thingd:latest
          env:
            - name: THINGD_PATH
              value: /data/thingd.db
            - name: THINGD_DRIVER
              value: native
            - name: THINGD_HOST
              value: 0.0.0.0
            - name: THINGD_PORT
              value: "8757"
            - name: THINGD_CLUSTER_MODE
              value: leader
            - name: THINGD_ADVERTISE_URL
              value: http://thingd-leader:8757
            - name: THINGD_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: thingd-cluster-auth
                  key: THINGD_AUTH_TOKEN
          ports:
            - name: thingd
              containerPort: 8757
          readinessProbe:
            httpGet:
              path: /healthz
              port: thingd
          volumeMounts:
            - name: thingd-data
              mountPath: /data
      volumes:
        - name: thingd-data
          persistentVolumeClaim:
            claimName: thingd-leader-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: thingd-leader-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: thingd-follower
spec:
  replicas: 2
  selector:
    matchLabels:
      app: thingd-follower
  template:
    metadata:
      labels:
        app: thingd-follower
    spec:
      containers:
        - name: thingd
          image: ghcr.io/sayanmohsin/thingd:latest
          env:
            - name: THINGD_PATH
              value: /data/thingd.db
            - name: THINGD_DRIVER
              value: native
            - name: THINGD_HOST
              value: 0.0.0.0
            - name: THINGD_PORT
              value: "8757"
            - name: THINGD_CLUSTER_MODE
              value: follower
            - name: THINGD_CLUSTER_LEADER_URL
              value: http://thingd-leader:8757
            - name: THINGD_CLUSTER_FORWARD_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: thingd-cluster-auth
                  key: THINGD_AUTH_TOKEN
            - name: THINGD_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: thingd-cluster-auth
                  key: THINGD_AUTH_TOKEN
          ports:
            - name: thingd
              containerPort: 8757
          readinessProbe:
            httpGet:
              path: /healthz
              port: thingd
          volumeMounts:
            - name: thingd-data
              mountPath: /data
      volumes:
        - name: thingd-data
          emptyDir: {}
