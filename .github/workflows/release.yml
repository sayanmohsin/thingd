name: Release

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  check-release:
    name: Check if release is needed
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.check.outputs.needed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
      - name: Check for conventional commits since last tag
        id: check
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Last tag: $LAST_TAG"
          COMMITS=$(git log "$LAST_TAG..HEAD" --format="%s" --no-decorate 2>/dev/null || echo "")
          if echo "$COMMITS" | grep -qiE "^(feat!?|fix!?|BREAKING CHANGE|docs!?|perf!?|refactor!?|style!?|test!?|chore!?)[:(]"; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Release needed — found conventional commits since $LAST_TAG"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "No release needed — no conventional commits since $LAST_TAG"
          fi

  build-native:
    name: Build native (${{ matrix.platform }}-${{ matrix.arch }})
    needs: [check-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - os: macos-14
            platform: darwin
            arch: arm64
          - os: macos-15
            platform: darwin
            arch: x64
          - os: windows-2025
            platform: win32
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        if: ${{ needs.check-release.outputs.needed == 'true' }}
        with:
          fetch-depth: 0
          ref: main
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ needs.check-release.outputs.needed == 'true' }}
      - uses: Swatinem/rust-cache@v2
        if: ${{ needs.check-release.outputs.needed == 'true' }}
        with:
          key: native-${{ hashFiles('packages/thingd-native/**/*.rs', 'crates/thingd/src/**/*.rs') }}
      - run: cargo build -p thingd-native --release
        if: ${{ needs.check-release.outputs.needed == 'true' }}
      - run: node packages/thingd-native/scripts/copy-prebuild.mjs
        if: ${{ needs.check-release.outputs.needed == 'true' }}
      - name: Test native filter on ${{ matrix.platform }}-${{ matrix.arch }}
        if: ${{ needs.check-release.outputs.needed == 'true' }}
        shell: bash
        run: |
          node << 'EOF'
          const { NativeThingStore } = require('./packages/thingd-native');
          const path = require('node:os').tmpdir() + '/thingd-filter-test.db';
          const store = NativeThingStore.open(path);
          store.putObjectJson('test', '1', JSON.stringify({status:'active'}));
          const r1 = store.listObjectsJson('["test"]', '{"status":"nonexistent"}', null, null, null, null);
          if (JSON.parse(r1).length !== 0) throw new Error('Non-matching filter returned non-empty');
          const r2 = store.listObjectsJson('["test"]', '{"status":"active"}', null, null, null, null);
          if (JSON.parse(r2).length !== 1) throw new Error('Matching filter returned wrong count');
          console.log('Native filter test passed on', process.platform, process.arch);
          try { require('node:fs').unlinkSync(path); } catch {}
          EOF
      - uses: actions/upload-artifact@v7
        with:
          name: prebuild-${{ matrix.platform }}-${{ matrix.arch }}
          path: packages/thingd-native/prebuilds/
          retention-days: 1
        if: ${{ needs.check-release.outputs.needed == 'true' }}

  release:
    name: Publish to npm
    needs: [check-release, build-native]
    if: ${{ needs.check-release.outputs.needed == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
      released: ${{ steps.version.outputs.released }}
    env:
      LEFTHOOK: "0"
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Configure npm auth for @thingd scope
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" >> .npmrc

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @thingd/sdk --filter @thingd/cli build

      - name: Download prebuild artifacts
        uses: actions/download-artifact@v8
        with:
          path: prebuild-artifacts
          pattern: prebuild-*

      - name: Merge prebuilds into thingd-native package
        run: |
          mkdir -p packages/thingd-native/prebuilds
          for dir in prebuild-artifacts/*/; do
            if [ -d "$dir" ]; then
              cp -r "$dir". packages/thingd-native/prebuilds/
            fi
          done
          echo "Prebuilds after merge:"
          ls -la packages/thingd-native/prebuilds/*/

      - name: Publish release
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BEFORE=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "Version before release: $BEFORE"
          pnpm release
          AFTER=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "Version after release: $AFTER"
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "new_version=$AFTER" >> "$GITHUB_OUTPUT"
            echo "New release: $AFTER"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "No new release created"
          fi

  docker:
    name: Build and push Docker image
    needs: [check-release, build-native]
    if: ${{ needs.check-release.outputs.needed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: server-${{ hashFiles('crates/thingd-server/**/*.rs', 'crates/thingd/src/**/*.rs') }}

      - name: Build thingd-server binary
        run: |
          RUSTFLAGS="-C target-feature=+crt-static" cargo build -p thingd-server --release
          mkdir -p docker-context
          cp target/release/thingd-server docker-context/

      - name: Get next version
        id: version
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: sayanmohsin
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: docker-context
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            sayanmohsin/thingd:${{ steps.version.outputs.version }}
            sayanmohsin/thingd:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  crates-publish:
    name: Publish to crates.io
    needs: [release]
    if: ${{ needs.release.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify version matches
        run: |
          EXPECTED="${{ needs.release.outputs.new_version }}"
          ACTUAL=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Version mismatch — Cargo.toml has $ACTUAL but expected $EXPECTED"
            exit 1
          fi

      - name: Publish to crates.io
        run: cargo publish -p thingd --features sqlite
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
