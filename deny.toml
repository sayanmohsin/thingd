[advisories]
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
allow-wildcard-paths = false
skip = [
    { name = "hashbrown", version = "0.16" },
    { name = "hashbrown", version = "0.17" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
