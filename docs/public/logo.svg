<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 48" width="100%" height="100%">
  <defs>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e05316"/>
      <stop offset="100%" stop-color="#ff6a00"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c4d4"/>
      <stop offset="100%" stop-color="#00e5f0"/>
    </linearGradient>
    <filter id="glow-orange" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <g font-family="ui-monospace, 'Cascadia Code', 'Fira Code', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="30" font-weight="700" letter-spacing="-0.5">
    <text x="12" y="35" fill="url(#orange)" filter="url(#glow-orange)">{</text>
    <text x="36" y="35" fill="url(#cyan)" filter="url(#glow-cyan)">thing</text>
    <text x="115" y="35" fill="url(#orange)" filter="url(#glow-orange)">d}</text>
  </g>
</svg>
