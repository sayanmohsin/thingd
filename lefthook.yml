pre-push:
  parallel: true
  commands:
    lint:
      run: pnpm check
    build:
      run: pnpm build
    test-node:
      run: pnpm test:node
    test-cli:
      run: pnpm test:cli
    test-rust:
      run: pnpm test:rust
    rust-fmt:
      run: cargo fmt --all --check
    rust-clippy:
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings
    rust-deny:
      run: cargo deny check
