[package]
name = "thingd-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core primitives for thingd, an object-shaped local memory engine for apps and agents."
readme = "README.md"
keywords = ["ai", "memory", "mcp", "sqlite"]
categories = ["database-implementations"]

[features]
default = []
sqlite = ["dep:rusqlite"]

[dependencies]
rusqlite = { version = "0.40.0", features = ["bundled"], optional = true }

[dev-dependencies]
tempfile = "3.23.0"

[[example]]
name = "storage_bench"
required-features = ["sqlite"]

[lib]
path = "src/lib.rs"

[lints]
workspace = true
