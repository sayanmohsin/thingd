name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_version:
        description: "Existing release version to retry, for example 0.72.0"
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

env:
  LEFTHOOK: "0"
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"

jobs:
  classify_release:
    name: Classify main update
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      release_merge: ${{ steps.classify.outputs.release_merge }}
      version: ${{ steps.classify.outputs.version }}
    steps:
      - name: Classify event
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          RETRY_VERSION: ${{ inputs.publish_version }}
        run: |
          if [ -n "$RETRY_VERSION" ]; then
            echo "release_merge=true" >> "$GITHUB_OUTPUT"
            echo "version=$RETRY_VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RELEASE_REF=$(gh api \
            "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq 'map(select(.base.ref == "main")) | .[0].head.ref // ""')
          if [[ "$RELEASE_REF" == release/v* ]]; then
            echo "release_merge=true" >> "$GITHUB_OUTPUT"
            echo "version=${RELEASE_REF#release/v}" >> "$GITHUB_OUTPUT"
          else
            echo "release_merge=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

  prepare-release-pr:
    name: Prepare release PR
    needs: classify_release
    if: ${{ needs.classify_release.outputs.release_merge != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: main

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Calculate release plan
        id: plan
        run: |
          node scripts/prepare-release-pr.mjs --plan --json release-plan.json
          echo "needed=$(jq -r '.needed' release-plan.json)" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r '.version // empty' release-plan.json)" >> "$GITHUB_OUTPUT"

      - name: Create release branch and PR
        if: ${{ steps.plan.outputs.needed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          BRANCH="release/v${VERSION}"
          BODY_FILE="release-notes.md"
          jq -r '.notes' release-plan.json > "$BODY_FILE"

          if [ "$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$BRANCH" --json number --jq 'length')" -gt 0 ]; then
            echo "Release PR $BRANCH already exists"
            exit 0
          fi

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$BRANCH" \
              --title "chore(release): v${VERSION}" \
              --body-file "$BODY_FILE"
            exit 0
          fi

          git switch --create "$BRANCH" origin/main
          node scripts/prepare-release-pr.mjs --apply --plan-file release-plan.json
          rm -f release-plan.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md Cargo.toml README.md \
            crates/thingd/README.md crates/thingd-server/Cargo.toml \
            packages/thingd/package.json packages/thingd/src/version.ts \
            packages/thingd-cli/package.json packages/thingd-native/package.json \
            packages/thingd-native/Cargo.toml packages/thingd-client/package.json
          git commit -m "chore(release): v${VERSION}"
          git push origin "$BRANCH"
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$BRANCH" \
            --title "chore(release): v${VERSION}" \
            --body-file "$BODY_FILE"
          rm -f "$BODY_FILE"

  build-native:
    name: Build native (${{ matrix.platform }}-${{ matrix.arch }})
    needs: classify_release
    if: ${{ needs.classify_release.outputs.release_merge == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - os: macos-14
            platform: darwin
            arch: arm64
          - os: macos-15
            platform: darwin
            arch: x64
          - os: windows-2025
            platform: win32
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-${{ hashFiles('packages/thingd-native/**/*.rs', 'crates/thingd/src/**/*.rs') }}
      - run: cargo build -p thingd-native --release
      - run: node packages/thingd-native/scripts/copy-prebuild.mjs
      - name: Test native filter on ${{ matrix.platform }}-${{ matrix.arch }}
        shell: bash
        run: |
          node <<'EOF'
          const { NativeThingStore } = require('./packages/thingd-native');
          const path = require('node:os').tmpdir() + '/thingd-filter-test.db';
          const store = NativeThingStore.open(path);
          store.putObjectJson('test', '1', JSON.stringify({status:'active'}));
          (async () => {
            const r1 = await store.listObjectsJson('["test"]', '{"status":"nonexistent"}', null, null, null, null);
            if (JSON.parse(r1).length !== 0) throw new Error('Non-matching filter returned non-empty');
            const r2 = await store.listObjectsJson('["test"]', '{"status":"active"}', null, null, null, null);
            if (JSON.parse(r2).length !== 1) throw new Error('Matching filter returned wrong count');
            try { require('node:fs').unlinkSync(path); } catch {}
          })();
          EOF
      - uses: actions/upload-artifact@v7
        with:
          name: prebuild-${{ matrix.platform }}-${{ matrix.arch }}
          path: packages/thingd-native/prebuilds/
          retention-days: 1

  publish-packages:
    name: Publish npm packages
    needs: [classify_release, build-native]
    if: ${{ needs.classify_release.outputs.release_merge == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configure npm auth for @thingd scope
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" >> .npmrc
      - uses: actions/download-artifact@v8
        with:
          path: prebuild-artifacts
          pattern: prebuild-*
      - name: Merge prebuilds
        run: |
          mkdir -p packages/thingd-native/prebuilds
          for dir in prebuild-artifacts/*/; do [ -d "$dir" ] && cp -r "$dir". packages/thingd-native/prebuilds/; done
      - name: Publish packages if missing
        run: |
          VERSION=$(node -p "require('./packages/thingd/package.json').version")
          publish_if_missing() {
            PACKAGE="$1"
            if npm view "${PACKAGE}@${VERSION}" version >/dev/null 2>&1; then
              echo "${PACKAGE}@${VERSION} already exists"
            else
              pnpm --filter "$PACKAGE" publish --access public --no-git-checks
            fi
          }
          publish_if_missing @thingd/sdk
          publish_if_missing @thingd/cli
          publish_if_missing @thingd/native
          publish_if_missing @thingd/client

  docker:
    name: Publish Docker image
    needs: [classify_release, build-native]
    if: ${{ needs.classify_release.outputs.release_merge == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl, x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: docker-${{ hashFiles('**/Cargo.lock') }}
          cache-on-failure: true
      - name: Install cross-compilation dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake musl-tools pipx
      - name: Install zig
        run: |
          curl -sL https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz | tar xJ -C /tmp
          mkdir -p "$HOME/.local/bin"
          ln -sf /tmp/zig-linux-x86_64-0.14.0/zig "$HOME/.local/bin/zig"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: pipx install cargo-zigbuild
      - run: |
          cargo build -p thingd-server --release --target x86_64-unknown-linux-musl
          mkdir -p docker-context
          cp target/x86_64-unknown-linux-musl/release/thingd-server docker-context/thingd-server-amd64
      - run: |
          cargo zigbuild -p thingd-server --release --target aarch64-unknown-linux-musl
          cp target/aarch64-unknown-linux-musl/release/thingd-server docker-context/thingd-server-arm64
      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./packages/thingd/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: sayanmohsin
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v7
        with:
          context: docker-context
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            sayanmohsin/thingd:v${{ steps.version.outputs.version }}
            sayanmohsin/thingd:latest
          cache-from: type=gha,scope=thingd-release-image
          cache-to: type=gha,mode=max,scope=thingd-release-image
          provenance: false
          sbom: false

  crates-publish:
    name: Publish crates.io package
    needs: classify_release
    if: ${{ needs.classify_release.outputs.release_merge == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish crate if missing
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          if curl -fsS "https://crates.io/api/v1/crates/thingd/${VERSION}" >/dev/null; then
            echo "thingd ${VERSION} already exists"
          else
            cargo publish -p thingd --features persistent,search
          fi

  finalize-release:
    name: Tag and create GitHub Release
    needs: [classify_release, publish-packages, docker, crates-publish]
    if: ${{ needs.classify_release.outputs.release_merge == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: main
      - name: Create tag and GitHub Release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./packages/thingd/package.json').version")
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "${TAG} already exists"
            exit 0
          fi
          awk 'BEGIN { found=0 } /^## / { if (found) exit; found=1 } found { print }' CHANGELOG.md > release-notes.md
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse HEAD)" \
            --title "$TAG" \
            --notes-file release-notes.md
