name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-targets --all-features

  node-build-test:
    name: Node build+test (${{ matrix.platform }}-${{ matrix.arch }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
            run_package_test: "true"
          - os: macos-14
            platform: darwin
            arch: arm64
            run_package_test: "true"
          - os: macos-15
            platform: darwin
            arch: x64
            run_package_test: "true"
          - os: windows-2025
            platform: win32
            arch: x64
            run_package_test: "false"
    runs-on: ${{ matrix.os }}
    needs: [rust]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm --filter !examples* -r --if-present build
      - run: pnpm test:node
      - run: pnpm test:cli
      - run: pnpm test:package
        if: matrix.run_package_test == 'true'
      - run: echo "Skipping pnpm test:package on Windows (cmd.exe spawn issue)"
        if: matrix.run_package_test == 'false'

  node-build-test-pr:
    name: Node build+test (ubuntu)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [rust]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm --filter !examples* -r --if-present build
      - run: pnpm test:node
      - run: pnpm test:cli
      - run: pnpm test:package
