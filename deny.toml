[advisories]
ignore = [
    "RUSTSEC-2023-0071", # rsa: Marvin Attack — no fix available
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "CDLA-Permissive-2.0",
    "BSD-2-Clause",
    "0BSD",
    "BSL-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
allow-wildcard-paths = false
skip = [
    { name = "hashbrown", version = "0.16" },
    { name = "hashbrown", version = "0.17" },
    { name = "hashbrown", version = "0.14" },
    { name = "hashbrown", version = "0.15" },
    # RocksDB's bindgen build dependency still requires these older versions;
    # Tantivy and the rest of the workspace resolve newer compatible versions.
    { name = "itertools", version = "0.13" },
    { name = "shlex", version = "1.3" },
    { name = "foldhash", version = "0.1" },
    { name = "foldhash", version = "0.2" },
    { name = "getrandom", version = "0.2" },
    { name = "getrandom", version = "0.4" },
    # getrandom 0.3 and 0.4 currently select incompatible r-efi major versions.
    { name = "r-efi", version = "5" },
    { name = "r-efi", version = "6" },
    { name = "syn", version = "2" },
    { name = "syn", version = "3" },
    { name = "tower-http", version = "0.6" },
    { name = "tower-http", version = "0.7" },
    { name = "webpki-roots", version = "0.26" },
    { name = "redox_syscall", version = "0.5" },
    { name = "redox_syscall", version = "0.9" },
    { name = "windows-sys", version = "0.48" },
    { name = "windows-sys", version = "0.52" },
    { name = "windows-sys", version = "0.59" },
    { name = "windows-sys", version = "0.61" },
    { name = "windows-targets", version = "0.48" },
    { name = "windows-targets", version = "0.52" },
    { name = "windows_aarch64_gnullvm", version = "0.48" },
    { name = "windows_aarch64_gnullvm", version = "0.52" },
    { name = "windows_aarch64_msvc", version = "0.48" },
    { name = "windows_aarch64_msvc", version = "0.52" },
    { name = "windows_i686_gnu", version = "0.48" },
    { name = "windows_i686_gnu", version = "0.52" },
    { name = "windows_i686_msvc", version = "0.48" },
    { name = "windows_i686_msvc", version = "0.52" },
    { name = "windows_x86_64_gnu", version = "0.48" },
    { name = "windows_x86_64_gnu", version = "0.52" },
    { name = "windows_x86_64_gnullvm", version = "0.48" },
    { name = "windows_x86_64_gnullvm", version = "0.52" },
    { name = "windows_x86_64_msvc", version = "0.48" },
    { name = "windows_x86_64_msvc", version = "0.52" },
    # SQLx 0.9 currently retains the 0.10 digest family while Thingd's
    # encryption stack uses the 0.11 family. These versions are required by
    # those incompatible upstream major-version requirements.
    { name = "block-buffer", version = "0.10" },
    { name = "cpufeatures", version = "0.2" },
    { name = "crypto-common", version = "0.1" },
    { name = "digest", version = "0.10" },
    { name = "sha2", version = "0.10" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
