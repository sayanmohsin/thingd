name: CI

on:
  pull_request:
    branches: [main, development]
    # Run required checks for history-only synchronization PRs as well as code PRs.
  push:
    branches: [main, development]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:

  workflow-lint:
    name: Workflow validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Validate workflow syntax, expressions, and shell scripts
        run: |
          shellcheck --version
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color

  # ── Fast gate: lint + typecheck (30s) ─────────────────
  lint:
    name: Lint (biome)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-pnpm
        with:
          lockfile: pnpm-lock.yaml
          cache-scope: root
      - name: Validate repository and release metadata
        run: |
          set -eu
          pnpm check
          pnpm check:actions
          pnpm check:docs
          pnpm check:cargo-versions
          pnpm test:publish-manifests
          node --test scripts/sync-cargo-local-dependency-versions.test.mjs
          pnpm docs:metadata
          git diff --exit-code -- docs/.generated/mcp-metadata.json
      - name: Set up documentation workspace
        uses: ./.github/actions/setup-pnpm
        with:
          lockfile: docs/pnpm-lock.yaml
          cache-scope: docs
          working-directory: docs
      - name: Build VitePress documentation
        run: |
          started=$SECONDS
          pnpm build
          echo "- docs build: $((SECONDS - started))s" >> "$GITHUB_STEP_SUMMARY"
        working-directory: docs

  native-toolchain:
    name: Native toolchain diagnostics
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux LLVM tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang llvm libclang-dev
      - name: Install macOS LLVM tools
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          {
            echo "PATH=$(brew --prefix llvm)/bin:$PATH"
            echo "LLVM_CONFIG_PATH=$(brew --prefix llvm)/bin/llvm-config"
            echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib"
          } >> "$GITHUB_ENV"
      - run: node --test scripts/check-native-toolchain.test.mjs
      - run: pnpm check:native-toolchain -- --json --strict

  thingdb-standalone:
    name: Standalone ThingDB crate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
        with:
          lockfile: pnpm-lock.yaml
          cache-scope: root
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: thingdb-standalone
          cache-all-crates: true
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Test standalone crate
        run: cargo test -p thingdb -p thingdb-ffi -p thingdb-node --all-targets
      - name: Lint standalone crate
        run: cargo clippy -p thingdb -p thingdb-ffi -p thingdb-node --all-targets -- -D warnings
      - name: Build standalone rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p thingdb --all-features --no-deps
      - name: Package and run an independent consumer
        run: node scripts/test-thingdb-package.mjs
      - name: Build and smoke-test standalone Node package
        run: node scripts/test-thingdb-node.mjs
      - name: Check standalone Node TypeScript declarations
        run: pnpm test:thingdb-types
      - name: Check C ABI header and Go binding
        run: node scripts/check-thingdb-bindings.mjs
      - name: Build ThingDB C ABI library
        run: cargo build --release -p thingdb-ffi
      - uses: actions/setup-go@v7
        with:
          go-version-file: bindings/go/go.mod
          cache-dependency-path: bindings/go/go.mod
      - name: Test Go binding
        working-directory: bindings/go
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/release
          CGO_LDFLAGS: -L${{ github.workspace }}/target/release
        run: go test ./...

  # ── Rust runtime: fmt + clippy + test (parallel to node) ─
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
      - name: Install RocksDB bindgen dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-runtime-${{ runner.os }}-${{ runner.arch }}
          cache-all-crates: true
          save-if: ${{ runner.os == 'Linux' }}
      - name: Validate Rust
        run: |
          set -eu
          cargo fmt --all --check
          started=$SECONDS
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          echo "- clippy: $((SECONDS - started))s" >> "$GITHUB_STEP_SUMMARY"
          started=$SECONDS
          cargo test --workspace --all-targets --all-features --locked
          echo "- Rust tests: $((SECONDS - started))s" >> "$GITHUB_STEP_SUMMARY"
          started=$SECONDS
          cargo test --doc --workspace --all-features --locked
          echo "- Rust documentation tests: $((SECONDS - started))s" >> "$GITHUB_STEP_SUMMARY"
          cargo check -p thingd --no-default-features --features thingdb-backend,search,vectors
          cargo test -p thingd --no-default-features --features thingdb-backend,search,vectors --lib thingdb
          native_default_tree="$(cargo tree -p thingd-native -e normal,build)"
          if ! grep -q 'librocksdb-sys' <<< "$native_default_tree"; then
            echo "Default native feature graph unexpectedly excludes librocksdb-sys" >&2
            exit 1
          fi
          # The all-features workspace check already compiles this native
          # RocksDB + ThingDB combination, which is also the crate default.
          cargo check -p thingd-native --no-default-features --features thingdb-backend,search,vectors
          native_thingdb_tree="$(cargo tree -p thingd-native --no-default-features --features thingdb-backend,search,vectors -e normal,build)"
          if grep -q 'librocksdb-sys' <<< "$native_thingdb_tree"; then
            echo "ThingDB-only native feature graph unexpectedly includes librocksdb-sys" >&2
            exit 1
          fi
          if cargo check -p thingd-native --no-default-features >/tmp/thingd-native-no-backend.log 2>&1; then
            echo "Native build without a backend unexpectedly succeeded" >&2
            exit 1
          fi
          if ! grep -q 'enable at least one native storage backend' /tmp/thingd-native-no-backend.log; then
            cat /tmp/thingd-native-no-backend.log >&2
            echo "Native build failed without the expected backend guidance" >&2
            exit 1
          fi
          started=$SECONDS
          cargo build -p thingd-server
          echo "- thingd-server build: $((SECONDS - started))s" >> "$GITHUB_STEP_SUMMARY"
          bash scripts/test-thingdb-backend.sh ./target/debug/thingd-server
          bash scripts/test-tenant-isolation.sh ./target/debug/thingd-server

  # ── Node tests (linux) — no `needs: [rust]` ──────────
  node:
    name: Node SDK, package, CLI, and native tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-pnpm
        with:
          lockfile: pnpm-lock.yaml
          cache-scope: root
      - uses: dtolnay/rust-toolchain@stable
      - name: Install RocksDB bindgen dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-node-native-${{ runner.os }}-${{ runner.arch }}
          cache-all-crates: true
          save-if: ${{ runner.os == 'Linux' }}
      - name: Build Node packages
        run: |
          started=$SECONDS
          pnpm build:node
          echo "- Node build: $((SECONDS - started))s" >> "$GITHUB_STEP_SUMMARY"
      - name: Check examples
        run: |
          started=$SECONDS
          pnpm examples:check:built
          echo "- examples:check:built: $((SECONDS - started))s" >> "$GITHUB_STEP_SUMMARY"
      - name: Run built Node tests
        run: |
          started=$SECONDS
          pnpm test:node:built
          pnpm test:package:built
          pnpm test:cli:built
          echo "- built Node tests: $((SECONDS - started))s" >> "$GITHUB_STEP_SUMMARY"
      - name: Exercise release build and package consumer path
        run: |
          VERSION=$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")
          node scripts/prepare-publish-manifests.mjs "$VERSION"
          # pnpm run can reinstall the workspace after manifest normalization.
          # Validate the prepared artifacts without changing workspace resolution.
          node --test scripts/publish-manifest.test.mjs
          RELEASE_VERSION="$VERSION" REQUIRED_NATIVE_PREBUILDS=0 node scripts/verify-publish-artifacts.mjs
      - name: Verify native ThingDB opt-in preserves the Node API
        run: |
          THINGD_STORAGE_BACKEND=thingdb node --input-type=module <<'EOF'
          import { mkdtempSync, rmSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          import { NativeThingStore } from './packages/thingd-native/index.js';

          const path = mkdtempSync(join(tmpdir(), 'thingd-native-thingdb-'));
          try {
            const store = NativeThingStore.open(path);
            store.putObjectJson('ci', 'thingdb', JSON.stringify({ backend: 'thingdb' }));
            const object = JSON.parse(store.getObjectJson('ci', 'thingdb'));
            if (JSON.parse(object.body).backend !== 'thingdb') {
              throw new Error('native ThingDB smoke test returned an unexpected object');
            }
            console.log('Native ThingDB API smoke test passed');
          } finally {
            rmSync(path, { recursive: true, force: true });
          }
          EOF
      - name: Verify native filter
        run: |
          node << 'EOF'
          (async () => {
          const { NativeThingStore } = require('./packages/thingd-native');
          const path = require('node:os').tmpdir() + '/thingd-filter-test.db';
          const store = NativeThingStore.open(path);
          store.putObjectJson('test', '1', JSON.stringify({status:'active'}));
          const r1 = await store.listObjectsJson('["test"]', '{"status":"nonexistent"}', null, null, null, null);
          if (JSON.parse(r1).length !== 0) throw new Error('Non-matching filter returned non-empty');
          const r2 = await store.listObjectsJson('["test"]', '{"status":"active"}', null, null, null, null);
          if (JSON.parse(r2).length !== 1) throw new Error('Matching filter returned wrong count');
          console.log('Native filter test passed');
          try { require('node:fs').rmSync(path, { recursive: true, force: true }); } catch {}
          })()
          EOF

  # Portable SDK/client/CLI compatibility; native addons are built in the Linux and release jobs.
  platform-test:
    needs: [lint]
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-15
            platform: darwin
            arch: arm64
          - os: macos-15-intel
            platform: darwin
            arch: x64
          - os: windows-2025
            platform: win32
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-pnpm
        with:
          lockfile: pnpm-lock.yaml
          cache-scope: root
      - name: Verify runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: node -e "if (process.arch !== process.env.EXPECTED_ARCH) throw new Error('Unexpected runner architecture')"
      - run: pnpm --filter @thingd/sdk --filter @thingd/client --filter @thingd/cli build
      - run: pnpm test:node:built
      - run: pnpm test:cli:portable:built
      - run: pnpm test:package:built
        if: matrix.os != 'windows-2025'

  browser:
    name: Dashboard browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-pnpm
        with:
          lockfile: pnpm-lock.yaml
          cache-scope: root
      - name: Build browser test dependencies
        run: pnpm --filter @thingd/sdk --filter @thingd/client --filter @thingd/cli build
      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Exercise dashboard login and remote database switching
        run: pnpm test:browser:built
      - name: Upload browser failure reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-browser-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: warn
