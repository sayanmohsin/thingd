<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 50" width="100%" height="100%" style="background: transparent; font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, monospace;">
  <defs>
    <filter id="main-orange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.7" result="blur"/>
      <feComponentTransfer in="blur" result="dimBlur">
        <feFuncA type="linear" slope="0.6"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="dimBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="main-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.7" result="blur"/>
      <feComponentTransfer in="blur" result="dimBlur">
        <feFuncA type="linear" slope="0.6"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="dimBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(15, 33)" font-size="24" font-weight="600">
    <tspan fill="#e05316" filter="url(#main-orange)">{</tspan>
    <tspan fill="#00c4d4" filter="url(#main-cyan)">thing</tspan>
    <tspan fill="#e05316" filter="url(#main-orange)">:d}</tspan>
  </g>
</svg>
