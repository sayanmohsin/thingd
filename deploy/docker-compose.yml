services:
  thingd-leader:
    build:
      context: ../docker-context
      dockerfile: Dockerfile
    image: thingd:local
    environment:
      THINGD_PATH: /data/thingd.db
      THINGD_DRIVER: native
      THINGD_HOST: 0.0.0.0
      THINGD_PORT: "8757"
      THINGD_AUTH_TOKEN: change-me
      THINGD_CLUSTER_MODE: leader
      THINGD_CLUSTER_DISCOVERY: static
      THINGD_CLUSTER_PEERS: http://thingd-leader:8757,http://thingd-follower:8757
      THINGD_ADVERTISE_URL: http://thingd-leader:8757
    ports:
      - "8757:8757"
    volumes:
      - thingd-leader-data:/data
    healthcheck:
      test: ["CMD", "/thingd-server", "--healthcheck", "http://127.0.0.1:8757/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  thingd-follower:
    image: thingd:local
    depends_on:
      thingd-leader:
        condition: service_healthy
    environment:
      THINGD_PATH: /data/thingd.db
      THINGD_DRIVER: native
      THINGD_HOST: 0.0.0.0
      THINGD_PORT: "8757"
      THINGD_AUTH_TOKEN: change-me
      THINGD_CLUSTER_MODE: follower
      THINGD_CLUSTER_LEADER_URL: http://thingd-leader:8757
      THINGD_CLUSTER_FORWARD_AUTH_TOKEN: change-me
      THINGD_CLUSTER_DISCOVERY: static
      THINGD_CLUSTER_PEERS: http://thingd-leader:8757,http://thingd-follower:8757
      THINGD_ADVERTISE_URL: http://thingd-follower:8757
    ports:
      - "8758:8757"
    volumes:
      - thingd-follower-data:/data
    healthcheck:
      test: ["CMD", "/thingd-server", "--healthcheck", "http://127.0.0.1:8757/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  thingd-leader-data:
  thingd-follower-data:
