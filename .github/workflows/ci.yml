name: CI

on:
  pull_request:
    branches: [main]
    # Run required checks for history-only synchronization PRs as well as code PRs.
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "pnpm-lock.yaml"
      - "biome.json"
      - "tsconfig*.json"
      - "crates/**"
      - "packages/**"
      - "scripts/**"
      - "examples/**"
      - "deploy/**"
      - "docs/**"
      - ".dockerignore"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:

  # Release commits are already validated by the release workflow. Skip only
  # the duplicate full push suite; pull requests and ordinary main pushes
  # retain the complete required checks.

  # ── Fast gate: lint + typecheck (30s) ─────────────────
  lint:
    name: Lint (biome)
    if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' || !startsWith(github.event.head_commit.message, 'chore(main): release') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-pnpm
        with:
          lockfile: pnpm-lock.yaml
          cache-scope: root
      - run: pnpm check
      - run: pnpm check:actions
      - run: pnpm check:docs
      - run: pnpm check:cargo-versions
      - run: pnpm test:publish-manifests
      - run: pnpm docs:metadata
      - run: git diff --exit-code -- docs/.generated/mcp-metadata.json
      - name: Set up documentation workspace
        uses: ./.github/actions/setup-pnpm
        with:
          lockfile: docs/pnpm-lock.yaml
          cache-scope: docs
          working-directory: docs
      - name: Build VitePress documentation
        run: |
          started=$SECONDS
          pnpm build
          echo "- docs build: $((SECONDS - started))s" >> "$GITHUB_STEP_SUMMARY"
        working-directory: docs

  # ── Rust runtime: fmt + clippy + test (parallel to node) ─
  rust:
    name: Rust (fmt, clippy, test)
    if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' || !startsWith(github.event.head_commit.message, 'chore(main): release') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install RocksDB bindgen dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
          cache-all-crates: true
          save-if: ${{ runner.os == 'Linux' }}
      - run: cargo fmt --all --check
      - name: Run Clippy
        run: |
          started=$SECONDS
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          echo "- clippy: $((SECONDS - started))s" >> "$GITHUB_STEP_SUMMARY"
      - name: Run Rust tests
        run: |
          started=$SECONDS
          cargo test --workspace --all-targets --all-features
          echo "- Rust tests: $((SECONDS - started))s" >> "$GITHUB_STEP_SUMMARY"
      - name: Run Rust documentation tests
        run: |
          started=$SECONDS
          cargo test --doc --workspace --all-features
          echo "- Rust documentation tests: $((SECONDS - started))s" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify ThingDB backend contract and format tests
        run: |
          cargo test -p thingdb --all-targets
          cargo test -p thingd --features persistent --lib thingdb
          cargo test -p thingd --features persistent --lib encrypted_thingdb
          cargo test -p thingd --features persistent --lib repacks_rocksdb_into_thingdb
      - name: Build Thingd server once
        run: |
          started=$SECONDS
          cargo build -p thingd-server
          echo "- thingd-server build: $((SECONDS - started))s" >> "$GITHUB_STEP_SUMMARY"
      - name: ThingDB server backend smoke test
        run: bash scripts/test-thingdb-backend.sh ./target/debug/thingd-server
      - name: Tenant isolation test
        run: bash scripts/test-tenant-isolation.sh ./target/debug/thingd-server

  # ── Node tests (linux) — no `needs: [rust]` ──────────
  node:
    name: Node SDK, package, CLI, and native tests
    if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' || !startsWith(github.event.head_commit.message, 'chore(main): release') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-pnpm
        with:
          lockfile: pnpm-lock.yaml
          cache-scope: root
      - uses: dtolnay/rust-toolchain@stable
      - name: Install RocksDB bindgen dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-node-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
          cache-all-crates: true
          save-if: ${{ runner.os == 'Linux' }}
      - name: Build Node packages
        run: |
          started=$SECONDS
          pnpm build:node
          echo "- build:node: $((SECONDS - started))s" >> "$GITHUB_STEP_SUMMARY"
      - name: Check examples
        run: |
          started=$SECONDS
          pnpm examples:check:built
          echo "- examples:check:built: $((SECONDS - started))s" >> "$GITHUB_STEP_SUMMARY"
      - name: Run built Node tests
        run: |
          started=$SECONDS
          pnpm test:node:built
          pnpm test:package:built
          pnpm test:cli:built
          echo "- built Node tests: $((SECONDS - started))s" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify native ThingDB opt-in preserves the Node API
        run: |
          THINGD_STORAGE_BACKEND=thingdb node --input-type=module <<'EOF'
          import { mkdtempSync, rmSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          import { NativeThingStore } from './packages/thingd-native/index.js';

          const path = mkdtempSync(join(tmpdir(), 'thingd-native-thingdb-'));
          try {
            const store = NativeThingStore.open(path);
            store.putObjectJson('ci', 'thingdb', JSON.stringify({ backend: 'thingdb' }));
            const object = JSON.parse(store.getObjectJson('ci', 'thingdb'));
            if (JSON.parse(object.body).backend !== 'thingdb') {
              throw new Error('native ThingDB smoke test returned an unexpected object');
            }
            console.log('Native ThingDB API smoke test passed');
          } finally {
            rmSync(path, { recursive: true, force: true });
          }
          EOF
      - name: Verify native filter
        run: |
          node << 'EOF'
          (async () => {
          const { NativeThingStore } = require('./packages/thingd-native');
          const path = require('node:os').tmpdir() + '/thingd-filter-test.db';
          const store = NativeThingStore.open(path);
          store.putObjectJson('test', '1', JSON.stringify({status:'active'}));
          const r1 = await store.listObjectsJson('["test"]', '{"status":"nonexistent"}', null, null, null, null);
          if (JSON.parse(r1).length !== 0) throw new Error('Non-matching filter returned non-empty');
          const r2 = await store.listObjectsJson('["test"]', '{"status":"active"}', null, null, null, null);
          if (JSON.parse(r2).length !== 1) throw new Error('Matching filter returned wrong count');
          console.log('Native filter test passed');
          try { require('node:fs').rmSync(path, { recursive: true, force: true }); } catch {}
          })()

  # ── Cross-platform (push to main only) ───────────────
  platform-test:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(main): release') }}
    needs: [lint, rust, node]
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-14
            platform: darwin
            arch: arm64
          - os: macos-15
            platform: darwin
            arch: x64
          - os: windows-2025
            platform: win32
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-pnpm
        with:
          lockfile: pnpm-lock.yaml
          cache-scope: root
      - run: pnpm --filter @thingd/sdk --filter @thingd/cli build
      - run: pnpm test:node:built
      - run: pnpm test:package:built
        if: matrix.os != 'windows-2025'
