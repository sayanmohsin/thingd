[package]
name = "thingd-native"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Native Node.js binding for thingd."
keywords = ["ai", "memory", "napi", "nodejs", "persistent-storage"]
categories = ["api-bindings", "database-implementations"]

[features]
default = ["rocksdb-backend", "thingdb-backend", "search", "vectors"]
# The shared engine still requires ThingDB for its RAM implementation.
rocksdb-backend = ["thingd/rocksdb-backend", "thingdb-backend"]
thingdb-backend = ["thingd/thingdb-backend"]
search = ["thingd/search"]
vectors = ["thingd/vectors"]

[lib]
crate-type = ["cdylib"]
path = "native/src/lib.rs"

[dependencies]
thingd = { path = "../../crates/thingd", version = "0.92", default-features = false } # x-release-please-version
thingd-schema = { path = "../../crates/thingd-schema", version = "0.92" }
napi = { version = "3.14.2", default-features = false, features = ["napi4"] }
napi-derive = "3.6.12"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[build-dependencies]
napi-build = "2.6.0"
