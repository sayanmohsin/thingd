[package]
name = "thingd-native"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Native Node.js binding for thingd."
keywords = ["ai", "memory", "napi", "nodejs", "sqlite"]
categories = ["api-bindings", "database-implementations"]

[lib]
crate-type = ["cdylib"]
path = "native/src/lib.rs"

[dependencies]
thingd = { path = "../../crates/thingd", version = "0.46", features = ["sqlite"] }
napi = { version = "3.10.0", default-features = false, features = ["napi4"] }
napi-derive = "3.5.8"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[build-dependencies]
napi-build = "2.3.2"
