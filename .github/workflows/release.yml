name: Release
run-name: Release ${{ github.ref_name }} @ ${{ github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_version:
        description: "Existing release version to retry, for example 0.72.1"
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  LEFTHOOK: "0"
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"

jobs:
  release-please:
    name: Create or finalize release PR
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created || steps.manual.outputs.release_created }}
      retry: ${{ steps.manual.outputs.retry }}
      version: ${{ steps.release.outputs.version || steps.manual.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name || steps.manual.outputs.tag_name }}
      started_at: ${{ steps.release-start.outputs.epoch }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Start release timer
        id: release-start
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Create release App token
        id: app-token
        if: ${{ inputs.publish_version == '' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: thingd
      - name: Run Release Please
        id: release
        if: ${{ inputs.publish_version == '' }}
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Summarize Release Please timing
        if: ${{ always() }}
        env:
          STARTED_AT: ${{ steps.release-start.outputs.epoch }}
        run: |
          elapsed=$(( $(date +%s) - STARTED_AT ))
          echo "### Release Please" >> "$GITHUB_STEP_SUMMARY"
          echo "- Decision elapsed: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"
      - name: Synchronize local Cargo dependency versions on release PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          PR_NUMBER=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&base=main&per_page=100" \
            --jq '.[] | select(.head.ref | startswith("release-please--branches--main--components--")) | .number' \
            | head -n 1)
          if [[ -z "$PR_NUMBER" ]]; then
            echo "No open Release Please PR found; nothing to synchronize."
            exit 0
          fi
          BRANCH=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.ref')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          node scripts/sync-cargo-local-dependency-versions.mjs
          cargo update -w
          git add Cargo.lock crates packages
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync release dependency versions"
            git push origin "$BRANCH"
          fi
      - name: Normalize manual retry
        id: manual
        if: ${{ inputs.publish_version != '' }}
        env:
          VERSION: ${{ inputs.publish_version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "publish_version must be a full SemVer value" >&2
            exit 1
          fi
          {
            echo "release_created=true"
            echo "retry=true"
            echo "version=$VERSION"
            echo "tag_name=thingd-v$VERSION"
          } >> "$GITHUB_OUTPUT"
      - name: Explain release decision
        if: ${{ always() }}
        env:
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          RELEASE_PR: ${{ steps.release.outputs.pr-number }}
          RETRY: ${{ steps.manual.outputs.retry }}
          VERSION: ${{ steps.release.outputs.version || steps.manual.outputs.version }}
        run: |
          {
            echo "### Release decision"
            if [[ "$RETRY" == "true" ]]; then
              echo "Manual retry requested for version `$VERSION`; publishing jobs are enabled."
            elif [[ "$RELEASE_CREATED" == "true" ]]; then
              echo "Release `$VERSION` was created; publishing jobs are enabled."
            elif [[ -n "$RELEASE_PR" ]]; then
              echo "Release PR #$RELEASE_PR was created or updated; publishing waits until it is merged."
            else
              echo "No release was created; publishing jobs are skipped for this push."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build-native:
    name: Build native
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' || needs.release-please.outputs.retry == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
            rust_target: ""
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            rust_target: ""
          - os: macos-14
            platform: darwin
            arch: arm64
            rust_target: ""
          - os: macos-14
            platform: darwin
            arch: x64
            rust_target: x86_64-apple-darwin
          - os: windows-2025
            platform: win32
            arch: x64
            rust_target: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install RocksDB bindgen dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev
      - name: Install RocksDB bindgen dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
      - name: Install RocksDB bindgen dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm -y --no-progress
          "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> $env:GITHUB_ENV
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.rust_target || 'native' }}-release
          key: ${{ hashFiles('**/Cargo.lock', 'packages/thingd-native/**/*.rs', 'crates/**/*.rs') }}
      - name: Remove stale native prebuilds
        run: >-
          node -e "require('node:fs').rmSync('packages/thingd-native/prebuilds', { recursive: true, force: true })"
      - name: Install cross-compilation target
        if: ${{ matrix.rust_target != '' }}
        run: rustup target add "${{ matrix.rust_target }}"
      - name: Build native library
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          started=$(date +%s)
          if [ -n "$RUST_TARGET" ]; then
            cargo build -p thingd-native --release --target "$RUST_TARGET"
          else
            cargo build -p thingd-native --release
          fi
          elapsed=$(( $(date +%s) - started ))
          echo "### Native build" >> "$GITHUB_STEP_SUMMARY"
          echo "- Platform: `${{ matrix.platform }}` / `${{ matrix.arch }}`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: `${RUST_TARGET:-host}`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Elapsed: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"
      - name: Copy native prebuild
        env:
          NATIVE_PLATFORM: ${{ matrix.platform }}
          NATIVE_ARCH: ${{ matrix.arch }}
          NATIVE_TARGET: ${{ matrix.rust_target }}
        run: node packages/thingd-native/scripts/copy-prebuild.mjs
      - name: Test native filter
        if: ${{ !(matrix.platform == 'darwin' && matrix.arch == 'x64') }}
        shell: bash
        run: |
          node <<'EOF'
          const { NativeThingStore } = require('./packages/thingd-native');
          const path = require('node:os').tmpdir() + '/thingd-filter-test.db';
          const store = NativeThingStore.open(path);
          store.putObjectJson('test', '1', JSON.stringify({status:'active'}));
          (async () => {
            const r1 = await store.listObjectsJson('["test"]', '{"status":"nonexistent"}', null, null, null, null);
            if (JSON.parse(r1).length !== 0) throw new Error('Non-matching filter returned non-empty');
            const r2 = await store.listObjectsJson('["test"]', '{"status":"active"}', null, null, null, null);
            if (JSON.parse(r2).length !== 1) throw new Error('Matching filter returned wrong count');
            try { require('node:fs').unlinkSync(path); } catch {}
          })();
          EOF
      - uses: actions/upload-artifact@v7
        with:
          name: prebuild-${{ matrix.platform }}-${{ matrix.arch }}
          path: packages/thingd-native/prebuilds/
          retention-days: 1

  publish-npm:
    name: Publish npm packages
    needs: [release-please, build-native]
    if: ${{ needs.release-please.outputs.release_created == 'true' || needs.release-please.outputs.retry == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: ./.github/actions/setup-pnpm
        with:
          lockfile: pnpm-lock.yaml
          cache-scope: root
          registry-url: https://registry.npmjs.org
      - name: Prepare publish manifests
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: node scripts/prepare-publish-manifests.mjs "$VERSION"
      - uses: actions/download-artifact@v8
        with:
          path: prebuild-artifacts
          pattern: prebuild-*
      - name: Merge native prebuilds
        run: |
          mkdir -p packages/thingd-native/prebuilds
          for dir in prebuild-artifacts/*/; do [ -d "$dir" ] && cp -r "$dir". packages/thingd-native/prebuilds/; done
      - name: Validate package artifacts
        env:
          REQUIRED_NATIVE_PREBUILDS: "5"
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          pnpm --filter @thingd/sdk --filter @thingd/cli --filter @thingd/client build
          pnpm verify:publish
      - name: Start npm publication timer
        id: npm-start
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Publish packages if missing
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          publish_if_missing() {
            PACKAGE="$1"
            case "$PACKAGE" in
              @thingd/sdk) PACKAGE_DIR="packages/thingd" ;;
              @thingd/native) PACKAGE_DIR="packages/thingd-native" ;;
              @thingd/cli) PACKAGE_DIR="packages/thingd-cli" ;;
              @thingd/client) PACKAGE_DIR="packages/thingd-client" ;;
              *) echo "Unknown package: $PACKAGE" >&2; return 1 ;;
            esac
            if npm view "${PACKAGE}@${VERSION}" version >/dev/null 2>&1; then
              echo "${PACKAGE}@${VERSION} already exists"
            else
              (cd "$PACKAGE_DIR" && npm publish --ignore-scripts --access public --provenance)
            fi
          }
          publish_if_missing @thingd/sdk
          publish_if_missing @thingd/native
          publish_if_missing @thingd/cli
          publish_if_missing @thingd/client
      - name: Verify published CLI installation
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          SMOKE_DIR=$(mktemp -d)
          trap 'rm -rf "$SMOKE_DIR"' EXIT
          delay=2
          for attempt in $(seq 1 8); do
            if npm view "@thingd/cli@$VERSION" version --registry=https://registry.npmjs.org 2>/dev/null | grep -qx "$VERSION"; then
              break
            fi
            if [ "$attempt" -eq 8 ]; then
              echo "@thingd/cli@$VERSION was not visible on npm within the bounded propagation window" >&2
              exit 1
            fi
            echo "Waiting for @thingd/cli@$VERSION to propagate on npm (attempt $attempt/8; next wait ${delay}s)"
            sleep "$delay"
            delay=$(( delay * 2 ))
            if [ "$delay" -gt 30 ]; then
              delay=30
            fi
          done
          npm init -y --prefix "$SMOKE_DIR" >/dev/null
          npm install --prefix "$SMOKE_DIR" --prefer-online --no-audit --no-fund "@thingd/cli@$VERSION"
          (cd "$SMOKE_DIR" && node --input-type=module -e "await import('@thingd/cli')")
      - name: Summarize npm publication timing
        if: ${{ always() }}
        env:
          STARTED_AT: ${{ steps.npm-start.outputs.epoch }}
        run: |
          if [ -n "$STARTED_AT" ]; then
            elapsed=$(( $(date +%s) - STARTED_AT ))
            echo "### npm publication" >> "$GITHUB_STEP_SUMMARY"
            echo "- Publish and propagation verification elapsed: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"
          fi

  docker-binary:
    name: Build Docker binary (${{ matrix.arch }})
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' || needs.release-please.outputs.retry == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
          - arch: arm64
            target: aarch64-unknown-linux-musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install RocksDB bindgen dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: docker-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-release
          key: ${{ hashFiles('**/Cargo.lock', 'crates/**/*.rs') }}
          cache-all-crates: true
          cache-on-failure: true
      - name: Install cross-compilation dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake musl-tools pipx
      - name: Restore cargo-zigbuild download cache
        id: cargo-zigbuild-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/pip
          key: cargo-zigbuild-${{ runner.os }}-${{ runner.arch }}-v1
          restore-keys: |
            cargo-zigbuild-${{ runner.os }}-${{ runner.arch }}-
      - name: Report cargo-zigbuild cache
        env:
          CACHE_HIT: ${{ steps.cargo-zigbuild-cache.outputs.cache-hit }}
          MATCHED_KEY: ${{ steps.cargo-zigbuild-cache.outputs.cache-matched-key }}
        run: |
          if [[ "$CACHE_HIT" == "true" ]]; then status="exact hit"; elif [[ -n "$MATCHED_KEY" ]]; then status="fallback hit"; else status="cold miss"; fi
          echo "cargo-zigbuild download cache: $status"
          echo "- cargo-zigbuild download cache: **$status**" >> "$GITHUB_STEP_SUMMARY"
      - name: Restore Zig toolchain
        id: zig-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/zig-0.14.0
          key: zig-${{ runner.os }}-${{ runner.arch }}-0.14.0
          restore-keys: |
            zig-${{ runner.os }}-${{ runner.arch }}-
      - name: Validate Zig cache
        id: zig-cache-status
        shell: bash
        env:
          ZIG_DIR: ${{ runner.temp }}/zig-0.14.0
          CACHE_HIT: ${{ steps.zig-cache.outputs.cache-hit }}
          MATCHED_KEY: ${{ steps.zig-cache.outputs.cache-matched-key }}
        run: |
          status="cold miss"
          valid=false
          if [[ -x "$ZIG_DIR/zig" ]] && [[ "$("$ZIG_DIR/zig" version 2>/dev/null)" == "0.14.0" ]]; then
            valid=true
            if [[ "$CACHE_HIT" == "true" ]]; then
              status="exact hit"
            else
              status="fallback hit"
            fi
          else
            rm -rf "$ZIG_DIR"
          fi
          echo "valid=$valid" >> "$GITHUB_OUTPUT"
          {
            echo "### Docker toolchain cache"
            echo "- Zig 0.14.0: **$status**"
            if [[ -n "$MATCHED_KEY" ]]; then
              echo "- Restored key: `$MATCHED_KEY`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install Zig
        if: steps.zig-cache-status.outputs.valid != 'true'
        run: |
          mkdir -p "${{ runner.temp }}"
          curl -sL https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz | tar xJ -C "${{ runner.temp }}"
          mv "${{ runner.temp }}/zig-linux-x86_64-0.14.0" "${{ runner.temp }}/zig-0.14.0"
      - name: Save Zig toolchain cache
        if: steps.zig-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/zig-0.14.0
          key: zig-${{ runner.os }}-${{ runner.arch }}-0.14.0
      - name: Add Zig to PATH
        run: |
          mkdir -p "$HOME/.local/bin"
          ln -sf "${{ runner.temp }}/zig-0.14.0/zig" "$HOME/.local/bin/zig"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: pipx install cargo-zigbuild
      - name: Save cargo-zigbuild download cache
        if: steps.cargo-zigbuild-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/pip
          key: cargo-zigbuild-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Build static server
        run: |
          started=$(date +%s)
          cargo zigbuild -p thingd-server --release --target "${{ matrix.target }}"
          elapsed=$(( $(date +%s) - started ))
          echo "### Docker binary build" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: `${{ matrix.target }}`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Elapsed: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"
      - name: Stage binary
        run: |
          mkdir -p docker-context
          cp "target/${{ matrix.target }}/release/thingd-server" "docker-context/thingd-server-${{ matrix.arch }}"
          chmod 755 "docker-context/thingd-server-${{ matrix.arch }}"
          test -x "docker-context/thingd-server-${{ matrix.arch }}"
          # GitHub artifact archives do not reliably preserve executable bits.
          # Store the binary in a tar archive so Docker assembly gets the mode
          # that was validated in this job.
          tar -czf "docker-context/thingd-server-${{ matrix.arch }}.tar.gz" \
            -C docker-context "thingd-server-${{ matrix.arch }}"
          rm "docker-context/thingd-server-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v7
        with:
          name: thingd-server-${{ matrix.arch }}
          path: docker-context/thingd-server-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  docker-validate:
    name: Validate Docker image (${{ matrix.arch }})
    needs: [release-please, docker-binary]
    if: ${{ needs.release-please.outputs.release_created == 'true' || needs.release-please.outputs.retry == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/download-artifact@v8
        with:
          name: thingd-server-${{ matrix.arch }}
          path: docker-context/artifact
      - name: Restore and validate binary permissions
        run: |
          set -eu
          archive="docker-context/artifact/thingd-server-${{ matrix.arch }}.tar.gz"
          test -f "$archive"
          tar -xzf "$archive" -C docker-context
          test -x "docker-context/thingd-server-${{ matrix.arch }}"
      - name: Build and smoke-test image
        env:
          THINGD_DOCKER_IMAGE: thingd-release-validation-${{ matrix.arch }}
          THINGD_DOCKER_PLATFORM: ${{ matrix.platform }}
          THINGD_DOCKER_PORT: 18757
        run: |
          started=$(date +%s)
          bash scripts/smoke-docker.sh
          elapsed=$(( $(date +%s) - started ))
          echo "### Docker validation" >> "$GITHUB_STEP_SUMMARY"
          echo "- Architecture: `${{ matrix.arch }}`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Elapsed: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: Publish Docker image
    needs: [release-please, docker-binary, docker-validate]
    if: ${{ needs.release-please.outputs.release_created == 'true' || needs.release-please.outputs.retry == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ needs.release-please.outputs.tag_name }}
      - name: Download Docker binaries
        uses: actions/download-artifact@v8
        with:
          pattern: thingd-server-*
          path: docker-context
          merge-multiple: true
      - name: Restore Docker binaries
        run: |
          set -eu
          for archive in docker-context/thingd-server-*.tar.gz; do
            tar -xzf "$archive" -C docker-context
          done
          test -x docker-context/thingd-server-amd64
          test -x docker-context/thingd-server-arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: sayanmohsin
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v7
        with:
          context: docker-context
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            sayanmohsin/thingd:v${{ needs.release-please.outputs.version }}
            sayanmohsin/thingd:latest
          cache-from: type=gha,scope=thingd-release-image
          cache-to: type=gha,mode=max,scope=thingd-release-image
          provenance: false
          sbom: false

  crates-publish:
    name: Publish crates.io package
    needs: [release-please]
    if: ${{ needs.release-please.outputs.release_created == 'true' || needs.release-please.outputs.retry == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install RocksDB bindgen dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev llvm-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: crates-${{ runner.os }}-${{ runner.arch }}-release
          key: ${{ hashFiles('**/Cargo.lock', 'crates/**/*.rs', 'packages/**/*.rs') }}
          cache-all-crates: true
      - name: Configure libclang
        run: |
          echo "LLVM_CONFIG_PATH=$(command -v llvm-config)" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> "$GITHUB_ENV"
      - name: Prepare public Cargo manifest
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: node scripts/prepare-cargo-publish.mjs "$VERSION"
      - name: Publish crate if missing
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          started=$(date +%s)
          trap 'elapsed=$(( $(date +%s) - started )); echo "### crates.io publication" >> "$GITHUB_STEP_SUMMARY"; echo "- Elapsed: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"' EXIT
          if curl -fsS -A "thingd-release/${GITHUB_REPOSITORY} run/${GITHUB_RUN_ID}" "https://crates.io/api/v1/crates/thingd/${VERSION}" >/dev/null; then
            echo "thingd ${VERSION} already exists"
          else
            cargo publish --allow-dirty -p thingd --features persistent,search
          fi

  release-timing:
    name: Summarize release timing
    needs: [release-please, publish-npm, docker, crates-publish]
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || needs.release-please.outputs.retry == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Write total release duration
        env:
          STARTED_AT: ${{ needs.release-please.outputs.started_at }}
        run: |
          if [ -z "$STARTED_AT" ]; then
            echo "Release start timestamp was unavailable" >&2
            exit 1
          fi
          elapsed=$(( $(date +%s) - STARTED_AT ))
          echo "### Total release path" >> "$GITHUB_STEP_SUMMARY"
          echo "- Elapsed through publication jobs: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"
