name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "LICENSE"
      - ".gitignore"
  push:
    branches: [main]
    paths-ignore:
      - "LICENSE"
      - ".gitignore"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  # ── Fast gate: lint + typecheck (30s) ─────────────────
  lint:
    name: Lint (biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  # ── Rust: fmt + clippy + test (parallel to node) ─────
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: engine-${{ hashFiles('**/Cargo.lock') }}
          save-if: ${{ runner.os == 'Linux' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-targets --all-features
      - run: cargo test --doc --workspace --all-features

  # ── Node unit tests (linux) — no `needs: [rust]` ─────
  node-unit:
    name: Node unit tests (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-${{ hashFiles('**/Cargo.lock') }}
          save-if: ${{ runner.os == 'Linux' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @thingd/sdk --filter @thingd/cli --filter @thingd/native build
      - run: pnpm test:node
      - run: pnpm test:package
      - name: Verify native filter
        run: |
          node << 'EOF'
          (async () => {
          const { NativeThingStore } = require('./packages/thingd-native');
          const path = require('node:os').tmpdir() + '/thingd-filter-test.db';
          const store = NativeThingStore.open(path);
          store.putObjectJson('test', '1', JSON.stringify({status:'active'}));
          const r1 = await store.listObjectsJson('["test"]', '{"status":"nonexistent"}', null, null, null, null);
          if (JSON.parse(r1).length !== 0) throw new Error('Non-matching filter returned non-empty');
          const r2 = await store.listObjectsJson('["test"]', '{"status":"active"}', null, null, null, null);
          if (JSON.parse(r2).length !== 1) throw new Error('Matching filter returned wrong count');
          console.log('Native filter test passed');
          try { require('node:fs').unlinkSync(path); } catch {}
          })()

  # ── CLI + integration tests (only after unit passes) ──
  node-cli:
    name: CLI + integration tests
    needs: [node-unit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-${{ hashFiles('**/Cargo.lock') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @thingd/sdk --filter @thingd/cli --filter @thingd/native build
      - run: pnpm test:cli

  # ── Cross-platform (push to main only) ───────────────
  platform-test:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, rust, node-unit]
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-14
            platform: darwin
            arch: arm64
          - os: macos-15
            platform: darwin
            arch: x64
          - os: windows-2025
            platform: win32
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @thingd/sdk --filter @thingd/cli build
      - run: pnpm test:node
      - run: pnpm test:package
        if: matrix.os != 'windows-2025'
