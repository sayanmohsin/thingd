name: Release

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  build-native:
    name: Build native (${{ matrix.platform }}-${{ matrix.arch }})
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: macos-14
            platform: darwin
            arch: arm64
          - os: macos-15
            platform: darwin
            arch: x64
          - os: windows-2025
            platform: win32
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p thingd-native --release
      - run: node packages/thingd-native/scripts/copy-prebuild.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: prebuild-${{ matrix.platform }}-${{ matrix.arch }}
          path: packages/thingd-native/prebuilds/
          retention-days: 1

  release:
    name: Publish to npm
    needs: [build-native]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Download prebuild artifacts
        uses: actions/download-artifact@v8
        with:
          path: prebuild-artifacts
          pattern: prebuild-*

      - name: Merge prebuilds into thingd-native package
        run: |
          mkdir -p packages/thingd-native/prebuilds
          for dir in prebuild-artifacts/*/; do
            if [ -d "$dir" ]; then
              cp -r "$dir". packages/thingd-native/prebuilds/
            fi
          done
          echo "Prebuilds after merge:"
          ls -la packages/thingd-native/prebuilds/*/

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter !examples* -r --if-present build

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm release

      - name: Read published version
        id: version
        run: |
          TAG=$(git describe --tags --abbrev=0)
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

  docker:
    name: Build and push Docker image
    needs: [release]
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: |
            sayanmohsin/thingd:${{ needs.release.outputs.version }}
            sayanmohsin/thingd:latest
