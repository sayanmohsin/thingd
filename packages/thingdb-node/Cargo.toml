[package]
name = "thingdb-node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Async Node.js binding for the standalone ThingDB embedded database."
keywords = ["thingdb", "nodejs", "database", "key-value", "napi"]
categories = ["api-bindings", "database-implementations"]

[lib]
crate-type = ["cdylib"]
path = "native/src/lib.rs"

[dependencies]
thingdb = { path = "../../crates/thingdb", version = "0.92" } # x-release-please-version
napi = { version = "3.14.2", default-features = false, features = ["napi8"] }
napi-derive = "3.6.12"

[build-dependencies]
napi-build = "2.6.0"

[lints.rust]
unsafe_code = "allow"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unused_crate_dependencies = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
multiple_crate_versions = "allow"
