name: CI

on:
  pull_request:
    branches: [main]
    # Run required checks for history-only synchronization PRs as well as code PRs.
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "pnpm-lock.yaml"
      - "biome.json"
      - "tsconfig*.json"
      - "crates/**"
      - "packages/**"
      - "scripts/**"
      - "examples/**"
      - "deploy/**"
      - "docs/**"
      - ".dockerignore"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  # ── Fast gate: lint + typecheck (30s) ─────────────────
  lint:
    name: Lint (biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm check:docs
      - run: pnpm check:cargo-versions
      - run: pnpm test:publish-manifests
      - run: pnpm docs:metadata
      - run: git diff --exit-code -- docs/.generated/mcp-metadata.json
      - name: Install documentation dependencies
        run: pnpm install --frozen-lockfile
        working-directory: docs
      - name: Build VitePress documentation
        run: pnpm build
        working-directory: docs

  # ── Rust runtime: fmt + clippy + test (parallel to node) ─
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install RocksDB bindgen dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
          save-if: ${{ runner.os == 'Linux' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude thingd-migrate --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --exclude thingd-migrate --all-targets --all-features
      - run: cargo test --doc --workspace --exclude thingd-migrate --all-features
      - name: Verify ThingDB backend contract and format tests
        run: |
          cargo test -p thingdb --all-targets
          cargo test -p thingd --features persistent --lib thingdb
          cargo test -p thingd --features persistent --lib encrypted_thingdb
          cargo test -p thingd --features persistent --lib repacks_rocksdb_into_thingdb
      - name: ThingDB server backend smoke test
        run: |
          cargo build -p thingd-server
          bash scripts/test-thingdb-backend.sh ./target/debug/thingd-server
      - name: Verify migration utility is outside runtime dependency graphs
        run: |
          if cargo tree -p thingd-server --all-features | grep -q '^.*fjall'; then
            echo 'thingd-server unexpectedly depends on Fjall'
            exit 1
          fi
          if cargo tree -p thingd-native --all-features | grep -q '^.*fjall'; then
            echo 'thingd-native unexpectedly depends on Fjall'
            exit 1
          fi
      - name: Tenant isolation test
        run: |
          cargo build -p thingd-server
          bash scripts/test-tenant-isolation.sh ./target/debug/thingd-server

  # ── Legacy migration: Fjall + RocksDB round-trip ──────
  migration:
    name: Migration (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install RocksDB bindgen dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
          save-if: ${{ runner.os == 'Linux' }}
      # Fjall is intentionally compiled only by this offline migration utility.
      - run: cargo fmt --all --check
      - run: cargo clippy -p thingd-migrate --all-targets --all-features -- -D warnings
      - run: cargo test -p thingd-migrate --all-targets --all-features

  # ── Node tests (linux) — no `needs: [rust]` ──────────
  node:
    name: Node SDK, package, CLI, and native tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - name: Install RocksDB bindgen dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
          save-if: ${{ runner.os == 'Linux' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:node
      - run: pnpm test:node:built
      - run: pnpm test:package:built
      - run: pnpm test:cli:built
      - name: Verify native ThingDB opt-in preserves the Node API
        run: |
          THINGD_STORAGE_BACKEND=thingdb node --input-type=module <<'EOF'
          import { mkdtempSync, rmSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          import { NativeThingStore } from './packages/thingd-native/index.js';

          const path = mkdtempSync(join(tmpdir(), 'thingd-native-thingdb-'));
          try {
            const store = NativeThingStore.open(path);
            store.putObjectJson('ci', 'thingdb', JSON.stringify({ backend: 'thingdb' }));
            const object = JSON.parse(store.getObjectJson('ci', 'thingdb'));
            if (JSON.parse(object.body).backend !== 'thingdb') {
              throw new Error('native ThingDB smoke test returned an unexpected object');
            }
            console.log('Native ThingDB API smoke test passed');
          } finally {
            rmSync(path, { recursive: true, force: true });
          }
          EOF
      - name: Verify native filter
        run: |
          node << 'EOF'
          (async () => {
          const { NativeThingStore } = require('./packages/thingd-native');
          const path = require('node:os').tmpdir() + '/thingd-filter-test.db';
          const store = NativeThingStore.open(path);
          store.putObjectJson('test', '1', JSON.stringify({status:'active'}));
          const r1 = await store.listObjectsJson('["test"]', '{"status":"nonexistent"}', null, null, null, null);
          if (JSON.parse(r1).length !== 0) throw new Error('Non-matching filter returned non-empty');
          const r2 = await store.listObjectsJson('["test"]', '{"status":"active"}', null, null, null, null);
          if (JSON.parse(r2).length !== 1) throw new Error('Matching filter returned wrong count');
          console.log('Native filter test passed');
          try { require('node:fs').rmSync(path, { recursive: true, force: true }); } catch {}
          })()

  # ── Cross-platform (push to main only) ───────────────
  platform-test:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, rust, node]
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-14
            platform: darwin
            arch: arm64
          - os: macos-15
            platform: darwin
            arch: x64
          - os: windows-2025
            platform: win32
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @thingd/sdk --filter @thingd/cli build
      - run: pnpm test:node
      - run: pnpm test:package
        if: matrix.os != 'windows-2025'
