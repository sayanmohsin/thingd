[package]
name = "thingd-native"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Native Node.js binding for thingd."
keywords = ["ai", "memory", "napi", "nodejs", "fjall"]
categories = ["api-bindings", "database-implementations"]

[lib]
crate-type = ["cdylib"]
path = "native/src/lib.rs"

[dependencies]
thingd = { path = "../../crates/thingd", version = "0.66", features = ["fjall", "search"] }
uuid = { version = "1", features = ["v4"] }
napi = { version = "3.11.0", default-features = false, features = ["napi4"] }
napi-derive = "3.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[build-dependencies]
napi-build = "2.3.2"
