<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 48" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e05316"/>
      <stop offset="100%" stop-color="#ff6a00"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c4d4"/>
      <stop offset="100%" stop-color="#00e5f0"/>
    </linearGradient>
    <filter id="glow-orange" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <text x="6" y="35" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.5">
    <tspan fill="url(#orange)" filter="url(#glow-orange)">{</tspan>
    <tspan fill="url(#cyan)" filter="url(#glow-cyan)">thing</tspan>
    <tspan fill="url(#orange)" filter="url(#glow-orange)">:d}</tspan>
  </text>
</svg>
