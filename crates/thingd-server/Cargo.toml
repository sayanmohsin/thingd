[package]
name = "thingd-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "HTTP sidecar for thingd — MCP + REST + cluster in a single static binary."
readme = "README.md"
keywords = ["mcp", "database", "server", "sidecar", "thingd"]
categories = ["database-implementations", "web-programming::http-server"]

[dependencies]
thingd = { path = "../thingd", version = "0.54", features = ["sqlite", "connectors"] }
axum = { version = "0.8", features = ["json", "macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tower-http = { version = "0.7", features = ["cors", "limit", "timeout", "set-header"] }
tower = { version = "0.5", features = ["buffer", "limit", "timeout", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
http-body-util = "0.1"
