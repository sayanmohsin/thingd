name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-targets --all-features

  node-build-test:
    name: Node build+test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            run_package_test: "true"
          - os: macos-14
            run_package_test: "true"
            # Only run full matrix on main push
            if_main: "true"
          - os: windows-latest
            run_package_test: "false"
            if_main: "true"
    runs-on: ${{ matrix.os }}
    # On PRs, only run ubuntu; on main, run all three
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      || matrix.if_main != 'true'
    needs: [rust]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      # Biome check (merged from node-check job)
      - run: pnpm check
      - run: pnpm --filter !examples* -r --if-present build
      - run: pnpm test:node
      - run: pnpm test:cli
      - run: pnpm test:package
        if: matrix.run_package_test == 'true'
      - run: echo "Skipping pnpm test:package on Windows (cmd.exe spawn issue)"
        if: matrix.run_package_test == 'false'
