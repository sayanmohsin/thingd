<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 50" width="100%" height="100%" style="background: transparent; font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, monospace;">
  <defs>
    <filter id="main-orange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.7" result="blur"/>
      <feComponentTransfer in="blur" result="dimBlur">
        <feFuncA type="linear" slope="0.6"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="dimBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="main-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.7" result="blur"/>
      <feComponentTransfer in="blur" result="dimBlur">
        <feFuncA type="linear" slope="0.6"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="dimBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(15, 31)" font-size="22" font-weight="500">
    <text x="0" fill="#e05316" filter="url(#main-orange)">{</text>
    
    <text x="13.2" fill="#00c4d4" filter="url(#main-cyan)">t</text>
    <text x="26.4" fill="#00c4d4" filter="url(#main-cyan)">h</text>
    <text x="39.6" fill="#00c4d4" filter="url(#main-cyan)">i</text>
    <text x="52.8" fill="#00c4d4" filter="url(#main-cyan)">n</text>
    <text x="66.0" fill="#00c4d4" filter="url(#main-cyan)">g</text>
    
    <text x="79.2" fill="#e05316" filter="url(#main-orange)">:</text>
    <text x="88.0" fill="#e05316" filter="url(#main-orange)">d</text>
    
    <text x="98.0" fill="#e05316" filter="url(#main-orange)">}</text>
  </g>
</svg>
