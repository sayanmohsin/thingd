# thingd-server configuration
# All values can be overridden by environment variables (THINGD_*).

server:
  # Bind address and port
  host: "0.0.0.0"
  port: 8757
  # Database path (or ":memory:" for in-memory)
  database: "/data/thingd.db"
  # Durable backend: "rocksdb" (default) or experimental "thingdb".
  storage_backend: "rocksdb"
  # Optional 64-character hexadecimal key; prefer THINGD_ENCRYPTION_KEY.
  encryption_key: null
  # Use "persistent-async" for bounded eventual search indexing, or
  # "persistent-no-rebuild" for write-cheap fallback scanning.
  search_mode: persistent
  search_commit_interval_ms: 250
  search_commit_batch_size: 32
  search_queue_max_keys: 10000
  # Thingd soft journal threshold; writes pause while recovery compacts storage.
  journal_max_bytes: 33554432
  # Conservative recovery budget for small hosts.
  recovery_batch_size: 32
  recovery_pause_ms: 50
  recovery_max_retries: 3
  # Optional resident-memory ceiling in bytes.
  recovery_memory_limit_bytes: null
  # Request timeout in seconds
  request_timeout_secs: 30
  # Maximum concurrent connections
  max_connections: 256

auth:
  # "bearer" for a static token, or "tenant-jwt" for scalable multi-tenant gateways.
  mode: "bearer"
  # Bearer token for API authentication (min 16 chars)
  # Override: THINGD_AUTH_TOKEN
  token: "change-me-with-a-random-token"
  # Allow unauthenticated requests (not recommended for production)
  allow_unauthenticated: false
  # Required per-tenant bearer tokens when tenant.mode is multi-tenant.
  tenant_tokens: {}
  # Required by tenant-jwt mode.
  jwks_url: ""
  issuer: ""
  audience: ""
  tenant_claim: "tenant_id"
  jwks_cache_secs: 300

tenant:
  # "single" for single-tenant, "multi-tenant" for file-per-tenant
  mode: "single"
  # HTTP header used to identify the tenant in multi-tenant mode
  header: "X-Tenant-Id"
  # Prefix for per-tenant database files: /data/{tenant_id}.db
  database_prefix: "/data/"

mcp:
  # MCP endpoint path
  path: "/mcp"
  # Reject all write operations
  read_only: false
  # Maximum MCP request body size (default 512KB)
  max_payload_bytes: 524288
  # Collection allowlist (empty = all collections allowed)
  collection_allowlist: []
  # Enable audit event stream for write operations
  audit: true

rest:
  # Enable REST API at /v1/*
  enabled: true

cluster:
  # Cluster mode: "single", "leader", or "follower"
  mode: "single"
  # This node's advertised URL (for failover)
  advertise_url: ""
  # Leader URL (required when mode is "follower")
  leader_url: ""
  # Fallback leader URL
  fallback_leader_url: ""
  # Static peer list
  peers: []
  # Discovery mechanism: "none", "static", "kubernetes"
  discovery: "static"
  # Auth token for inter-node forwarding
  forward_auth_token: ""
  # Enable automatic leader failover
  leader_election: false
  # Consecutive failures before triggering election
  election_max_failures: 3

hardening:
  # Connector access is deny-by-default.
  max_connector_file_bytes: 67108864
  connector_file_root: null
  connector_allowed_hosts: []
  connector_require_tls: true
