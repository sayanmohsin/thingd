name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-targets --all-features
      - run: cargo test --doc --workspace --all-features

  node-build-test:
    name: Node build+test (${{ matrix.platform }}-${{ matrix.arch }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
            build_native: "true"
            run_cli_test: "true"
            run_package_test: "true"
          - os: macos-14
            platform: darwin
            arch: arm64
            build_native: "false"
            run_cli_test: "false"
            run_package_test: "true"
          - os: macos-15
            platform: darwin
            arch: x64
            build_native: "false"
            run_cli_test: "false"
            run_package_test: "true"
          - os: windows-2025
            platform: win32
            arch: x64
            build_native: "false"
            run_cli_test: "false"
            run_package_test: "false"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.build_native == 'true'
      - uses: Swatinem/rust-cache@v2
        if: matrix.build_native == 'true'
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm --filter @thingd/sdk --filter @thingd/cli --filter @thingd/native build
        if: matrix.build_native == 'true'
      - run: pnpm --filter @thingd/sdk --filter @thingd/cli build
        if: matrix.build_native == 'false'
      - run: pnpm test:node
      - name: Verify native filter
        if: matrix.build_native == 'true'
        run: |
          node -e "
          const { NativeThingStore } = require('./packages/thingd-native');
          const store = NativeThingStore.open('/tmp/test.db');
          store.putObjectJson('test', '1', JSON.stringify({status:'active'}));
          const r1 = store.listObjectsJson('[\"test\"]', '{\"status\":\"nonexistent\"}', null, null, null, null);
          const c1 = JSON.parse(r1).length;
          if (c1 !== 0) throw new Error('Non-matching filter returned ' + c1 + ' (expected 0)');
          const r2 = store.listObjectsJson('[\"test\"]', '{\"status\":\"active\"}', null, null, null, null);
          const c2 = JSON.parse(r2).length;
          if (c2 !== 1) throw new Error('Matching filter returned ' + c2 + ' (expected 1)');
          console.log('Native filter test passed');
          "
      - run: pnpm test:cli
        if: matrix.run_cli_test == 'true'
      - run: pnpm test:package
        if: matrix.run_package_test == 'true'

  node-build-test-pr:
    name: Node build+test (linux-x64)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [rust]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm --filter @thingd/sdk --filter @thingd/cli --filter @thingd/native build
      - run: pnpm test:node
      - name: Verify native filter
        run: |
          node -e "
          const { NativeThingStore } = require('./packages/thingd-native');
          const store = NativeThingStore.open('/tmp/test.db');
          store.putObjectJson('test', '1', JSON.stringify({status:'active'}));
          const r1 = store.listObjectsJson('[\"test\"]', '{\"status\":\"nonexistent\"}', null, null, null, null);
          const c1 = JSON.parse(r1).length;
          if (c1 !== 0) throw new Error('Non-matching filter returned ' + c1 + ' (expected 0)');
          const r2 = store.listObjectsJson('[\"test\"]', '{\"status\":\"active\"}', null, null, null, null);
          const c2 = JSON.parse(r2).length;
          if (c2 !== 1) throw new Error('Matching filter returned ' + c2 + ' (expected 1)');
          console.log('Native filter test passed');
          "
      - run: pnpm test:cli
      - run: pnpm test:package

