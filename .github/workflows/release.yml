name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_version:
        description: "Existing release version to retry, for example 0.72.1"
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

env:
  LEFTHOOK: "0"
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"

jobs:
  release-please:
    name: Create or finalize release PR
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created || steps.manual.outputs.release_created }}
      retry: ${{ steps.manual.outputs.retry }}
      version: ${{ steps.release.outputs.version || steps.manual.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Run Release Please
        id: release
        if: ${{ inputs.publish_version == '' }}
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Normalize manual retry
        id: manual
        if: ${{ inputs.publish_version != '' }}
        env:
          VERSION: ${{ inputs.publish_version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "publish_version must be a full SemVer value" >&2
            exit 1
          fi
          {
            echo "release_created=true"
            echo "retry=true"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

  build-native:
    name: Build native (${{ matrix.platform }}-${{ matrix.arch }})
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' || needs.release-please.outputs.retry == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
            rust_target: ""
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            rust_target: ""
          - os: macos-14
            platform: darwin
            arch: arm64
            rust_target: ""
          - os: macos-14
            platform: darwin
            arch: x64
            rust_target: x86_64-apple-darwin
          - os: windows-2025
            platform: win32
            arch: x64
            rust_target: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: v${{ needs.release-please.outputs.version }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-${{ hashFiles('packages/thingd-native/**/*.rs', 'crates/thingd/src/**/*.rs') }}
      - name: Remove stale native prebuilds
        run: >-
          node -e "require('node:fs').rmSync('packages/thingd-native/prebuilds', { recursive: true, force: true })"
      - name: Install cross-compilation target
        if: ${{ matrix.rust_target != '' }}
        run: rustup target add "${{ matrix.rust_target }}"
      - name: Build native library
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          if [ -n "$RUST_TARGET" ]; then
            cargo build -p thingd-native --release --target "$RUST_TARGET"
          else
            cargo build -p thingd-native --release
          fi
      - name: Copy native prebuild
        env:
          NATIVE_PLATFORM: ${{ matrix.platform }}
          NATIVE_ARCH: ${{ matrix.arch }}
          NATIVE_TARGET: ${{ matrix.rust_target }}
        run: node packages/thingd-native/scripts/copy-prebuild.mjs
      - name: Test native filter
        if: ${{ !(matrix.platform == 'darwin' && matrix.arch == 'x64') }}
        shell: bash
        run: |
          node <<'EOF'
          const { NativeThingStore } = require('./packages/thingd-native');
          const path = require('node:os').tmpdir() + '/thingd-filter-test.db';
          const store = NativeThingStore.open(path);
          store.putObjectJson('test', '1', JSON.stringify({status:'active'}));
          (async () => {
            const r1 = await store.listObjectsJson('["test"]', '{"status":"nonexistent"}', null, null, null, null);
            if (JSON.parse(r1).length !== 0) throw new Error('Non-matching filter returned non-empty');
            const r2 = await store.listObjectsJson('["test"]', '{"status":"active"}', null, null, null, null);
            if (JSON.parse(r2).length !== 1) throw new Error('Matching filter returned wrong count');
            try { require('node:fs').unlinkSync(path); } catch {}
          })();
          EOF
      - uses: actions/upload-artifact@v7
        with:
          name: prebuild-${{ matrix.platform }}-${{ matrix.arch }}
          path: packages/thingd-native/prebuilds/
          retention-days: 1

  publish-npm:
    name: Publish npm packages
    needs: [release-please, build-native]
    if: ${{ needs.release-please.outputs.release_created == 'true' || needs.release-please.outputs.retry == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: v${{ needs.release-please.outputs.version }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          path: prebuild-artifacts
          pattern: prebuild-*
      - name: Merge native prebuilds
        run: |
          mkdir -p packages/thingd-native/prebuilds
          for dir in prebuild-artifacts/*/; do [ -d "$dir" ] && cp -r "$dir". packages/thingd-native/prebuilds/; done
      - name: Validate package artifacts
        env:
          REQUIRED_NATIVE_PREBUILDS: "5"
        run: |
          pnpm --filter @thingd/sdk build
          pnpm verify:publish
      - name: Publish packages if missing
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          publish_if_missing() {
            PACKAGE="$1"
            if npm view "${PACKAGE}@${VERSION}" version >/dev/null 2>&1; then
              echo "${PACKAGE}@${VERSION} already exists"
            else
              pnpm --filter "$PACKAGE" publish --access public --no-git-checks
            fi
          }
          publish_if_missing @thingd/sdk
          publish_if_missing @thingd/cli
          publish_if_missing @thingd/native
          publish_if_missing @thingd/client

  docker:
    name: Publish Docker image
    needs: [release-please, publish-npm]
    if: ${{ needs.release-please.outputs.release_created == 'true' || needs.release-please.outputs.retry == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: v${{ needs.release-please.outputs.version }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl, x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: docker-${{ hashFiles('**/Cargo.lock') }}
          cache-on-failure: true
      - name: Install cross-compilation dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake musl-tools pipx
      - name: Install zig
        run: |
          curl -sL https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz | tar xJ -C /tmp
          mkdir -p "$HOME/.local/bin"
          ln -sf /tmp/zig-linux-x86_64-0.14.0/zig "$HOME/.local/bin/zig"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: pipx install cargo-zigbuild
      - run: |
          cargo build -p thingd-server --release --target x86_64-unknown-linux-musl
          mkdir -p docker-context
          cp target/x86_64-unknown-linux-musl/release/thingd-server docker-context/thingd-server-amd64
      - run: |
          cargo zigbuild -p thingd-server --release --target aarch64-unknown-linux-musl
          cp target/aarch64-unknown-linux-musl/release/thingd-server docker-context/thingd-server-arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: sayanmohsin
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v7
        with:
          context: docker-context
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            sayanmohsin/thingd:v${{ needs.release-please.outputs.version }}
            sayanmohsin/thingd:latest
          cache-from: type=gha,scope=thingd-release-image
          cache-to: type=gha,mode=max,scope=thingd-release-image
          provenance: false
          sbom: false

  crates-publish:
    name: Publish crates.io package
    needs: [release-please, publish-npm]
    if: ${{ needs.release-please.outputs.release_created == 'true' || needs.release-please.outputs.retry == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: v${{ needs.release-please.outputs.version }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish crate if missing
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          if curl -fsS -A "thingd-release/${GITHUB_REPOSITORY} run/${GITHUB_RUN_ID}" "https://crates.io/api/v1/crates/thingd/${VERSION}" >/dev/null; then
            echo "thingd ${VERSION} already exists"
          else
            cargo publish -p thingd --features persistent,search
          fi
