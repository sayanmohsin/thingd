name: Release

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  check-release:
    name: Check if release is needed
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.check.outputs.needed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check for conventional commits since last tag
        id: check
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Last tag: $LAST_TAG"
          COMMITS=$(git log "$LAST_TAG..HEAD" --format="%s" --no-decorate 2>/dev/null || echo "")
          if echo "$COMMITS" | grep -qiE "^(feat!?|fix!?|BREAKING CHANGE|docs!?|perf!?|refactor!?|style!?|test!?|chore!?)[:(]"; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Release needed — found conventional commits since $LAST_TAG"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "No release needed — no conventional commits since $LAST_TAG"
          fi

  build-native:
    name: Build native (${{ matrix.platform }}-${{ matrix.arch }})
    needs: [check-release]
    if: ${{ needs.check-release.outputs.needed == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - os: macos-14
            platform: darwin
            arch: arm64
          - os: macos-15
            platform: darwin
            arch: x64
          - os: windows-2025
            platform: win32
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p thingd-native --release
      - run: node packages/thingd-native/scripts/copy-prebuild.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: prebuild-${{ matrix.platform }}-${{ matrix.arch }}
          path: packages/thingd-native/prebuilds/
          retention-days: 1

  release:
    name: Publish to npm
    needs: [check-release, build-native]
    if: ${{ needs.check-release.outputs.needed == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
      released: ${{ steps.version.outputs.released }}
    env:
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Configure npm auth for @thingd scope
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" >> .npmrc

      - name: Download prebuild artifacts
        uses: actions/download-artifact@v8
        with:
          path: prebuild-artifacts
          pattern: prebuild-*

      - name: Merge prebuilds into thingd-native package
        run: |
          mkdir -p packages/thingd-native/prebuilds
          for dir in prebuild-artifacts/*/; do
            if [ -d "$dir" ]; then
              cp -r "$dir". packages/thingd-native/prebuilds/
            fi
          done
          echo "Prebuilds after merge:"
          ls -la packages/thingd-native/prebuilds/*/

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @thingd/sdk --filter @thingd/cli build

      - name: Publish release
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BEFORE=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "Version before release: $BEFORE"
          pnpm release
          AFTER=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "Version after release: $AFTER"
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "new_version=$AFTER" >> "$GITHUB_OUTPUT"
            echo "New release: $AFTER"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "No new release created"
          fi

  docker:
    name: Build and push Docker image
    needs: [check-release, build-native]
    if: ${{ needs.check-release.outputs.needed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build thingd-server binary
        run: |
          cargo build -p thingd-server --release
          mkdir -p docker-context
          cp target/release/thingd-server docker-context/

      - name: Get next version
        id: version
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: sayanmohsin
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: docker-context
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            sayanmohsin/thingd:${{ steps.version.outputs.version }}
            sayanmohsin/thingd:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  crates-publish:
    name: Publish to crates.io
    needs: [release]
    if: ${{ needs.release.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify version matches
        run: |
          EXPECTED="${{ needs.release.outputs.new_version }}"
          ACTUAL=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Version mismatch — Cargo.toml has $ACTUAL but expected $EXPECTED"
            exit 1
          fi

      - name: Publish to crates.io
        run: cargo publish -p thingd --features sqlite
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
