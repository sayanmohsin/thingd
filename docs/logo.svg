<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 148 42" width="120" height="34" style="background: transparent;">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.7" result="blur"/>
      <feComponentTransfer in="blur" result="dimBlur">
        <feFuncA type="linear" slope="0.6"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="dimBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <text x="0" y="32" font-size="26" font-weight="600" font-family="Inter, system-ui, sans-serif" fill="#e05316">{</text>
    <text x="18" y="32" font-size="26" font-weight="600" font-family="Inter, system-ui, sans-serif" fill="#00c4d4">thing</text>
    <text x="92" y="32" font-size="26" font-weight="600" font-family="Inter, system-ui, sans-serif" fill="#e05316">:d}</text>
  </g>
</svg>
