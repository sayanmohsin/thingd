name: Release

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Publish to npm
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Download prebuild artifacts from CI
        uses: actions/download-artifact@v4
        with:
          path: prebuild-artifacts
          workflow: ci.yml
          workflow_run: ${{ github.event.workflow_run.id }}

      - name: Merge prebuilds into thingd-native package
        run: |
          mkdir -p packages/thingd-native/prebuilds
          for dir in prebuild-artifacts/*/; do
            if [ -d "$dir" ]; then
              cp -r "$dir". packages/thingd-native/prebuilds/
            fi
          done
          echo "Prebuilds after merge:"
          ls -la packages/thingd-native/prebuilds/*/

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter !examples* -r --if-present build

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm release