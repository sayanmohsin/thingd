[package]
name = "thingdb-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "C ABI for the standalone ThingDB embedded key-value database."
keywords = ["thingdb", "ffi", "database", "key-value", "c-abi"]
categories = ["api-bindings", "database-implementations"]
include = ["Cargo.toml", "README.md", "include/**", "src/**"]

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
thingdb = { path = "../../crates/thingdb", version = "0.92" } # x-release-please-version

[lints.rust]
unsafe_code = "allow"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unused_crate_dependencies = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
multiple_crate_versions = "allow"
