[advisories]
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]
confidence-threshold = 0.8

[[licenses.exceptions]]
name = "ar_archive_writer"
allow = ["Apache-2.0 WITH LLVM-exception"]

[[licenses.exceptions]]
name = "zstd-sys"
allow = ["BSD-2-Clause"]

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
allow-wildcard-paths = false
skip = [
    # The server uses parking_lot 0.13 while upstream crates still need 0.12.
    { name = "parking_lot", version = "0.12" },
    { name = "parking_lot_core", version = "0.9" },
    { name = "lock_api", version = "0.4" },
    { name = "redox_syscall", version = "0.5" },
    { name = "hashbrown", version = "0.16" },
    { name = "hashbrown", version = "0.17" },
    # RocksDB's bindgen build dependency still requires these older versions;
    # Tantivy and the rest of the workspace resolve newer compatible versions.
    { name = "itertools", version = "0.13" },
    { name = "shlex", version = "1.3" },
    { name = "getrandom", version = "0.2" },
    { name = "getrandom", version = "0.4" },
    { name = "syn", version = "2" },
    { name = "syn", version = "3" },
    { name = "tower-http", version = "0.6" },
    { name = "tower-http", version = "0.7" },
    { name = "windows-sys", version = "0.59" },
    { name = "windows-sys", version = "0.61" },
    # reqwest 0.13's Hyper stack requires base64 0.23 while jsonwebtoken,
    # SQLx, and Tantivy currently require the incompatible 0.22 series.
    { name = "base64", version = "0.23" },
    # Rustls uses Ring's untrusted 0.9 while AWS-LC-RS retains untrusted 0.7;
    # the two crypto backends cannot currently share this dependency version.
    { name = "untrusted", version = "0.7" },
    # Tantivy 0.27 depends on rand 0.9 while SQLx 0.9 depends on rand 0.10;
    # their incompatible major-version APIs also require matching rand_core and
    # getrandom platform crates.
    { name = "rand", version = "0.9" },
    { name = "rand_core", version = "0.9" },
    { name = "r-efi", version = "5" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
